<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Gonsiori ja Vesivärava ristmik: foorid A1, A2, B ja jalakäijate foorid J1–J3</title>
  <rect width="1240" height="820" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffffff"/></marker>
  </defs>

  <!-- maapind -->
  <rect x="20" y="20" width="780" height="780" rx="14" fill="#cfd8c4"/>
  <!-- teed -->
  <rect x="20" y="316" width="780" height="188" fill="#3a3a3e"/>
  <rect x="332" y="20" width="156" height="780" fill="#3a3a3e"/>
  <line x1="20" y1="410" x2="332" y2="410" stroke="#f4f2ee" stroke-width="3" stroke-dasharray="18 14" opacity=".7"/>
  <line x1="488" y1="410" x2="800" y2="410" stroke="#f4f2ee" stroke-width="3" stroke-dasharray="18 14" opacity=".7"/>
  <line x1="410" y1="20" x2="410" y2="232" stroke="#f4f2ee" stroke-width="3" stroke-dasharray="18 14" opacity=".7"/>
  <line x1="410" y1="588" x2="410" y2="800" stroke="#f4f2ee" stroke-width="3" stroke-dasharray="18 14" opacity=".7"/>

  <!-- ülekäigurajad -->
  <g fill="#ecebe6">
    <!-- J1 üle Vesivärava (põhjas) -->
    <rect x="340" y="240" width="12" height="54"/><rect x="364" y="240" width="12" height="54"/><rect x="388" y="240" width="12" height="54"/>
    <rect x="412" y="240" width="12" height="54"/><rect x="436" y="240" width="12" height="54"/><rect x="460" y="240" width="12" height="54"/>
    <!-- J3 üle Vesivärava (lõunas) -->
    <rect x="340" y="526" width="12" height="54"/><rect x="364" y="526" width="12" height="54"/><rect x="388" y="526" width="12" height="54"/>
    <rect x="412" y="526" width="12" height="54"/><rect x="436" y="526" width="12" height="54"/><rect x="460" y="526" width="12" height="54"/>
    <!-- J2 üle Gonsiori (läänes) -->
    <rect x="240" y="324" width="54" height="12"/><rect x="240" y="348" width="54" height="12"/><rect x="240" y="372" width="54" height="12"/>
    <rect x="240" y="396" width="54" height="12"/><rect x="240" y="420" width="54" height="12"/><rect x="240" y="444" width="54" height="12"/>
    <rect x="240" y="468" width="54" height="12"/><rect x="240" y="492" width="54" height="12"/>
  </g>

  <!-- tänavanimed -->
  <text x="40" y="306" font-size="22" font-weight="700" fill="#2b2b2f" letter-spacing="2">GONSIORI</text>
  <text x="510" y="60" font-size="22" font-weight="700" fill="#2b2b2f" letter-spacing="2">VESIVÄRAVA</text>

  <!-- sõidusuunad -->
  <line x1="60" y1="460" x2="180" y2="460" stroke="#fff" stroke-width="4" marker-end="url(#arr)" opacity=".8"/>
  <line x1="760" y1="360" x2="640" y2="360" stroke="#fff" stroke-width="4" marker-end="url(#arr)" opacity=".8"/>
  <line x1="450" y1="760" x2="450" y2="640" stroke="#fff" stroke-width="4" marker-end="url(#arr)" opacity=".8"/>

  <!-- autode foor: A1 -->
  <g>
    <rect x="186" y="516" width="40" height="104" rx="8" fill="#16161a"/>
    <circle cx="206" cy="540" r="12" fill="#e5322d"/><circle cx="206" cy="568" r="12" fill="#f2b100"/><circle cx="206" cy="596" r="12" fill="#17a852"/>
    <rect x="160" y="630" width="92" height="34" rx="8" fill="#1f5eff"/>
    <text x="206" y="654" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">A1</text>
  </g>
  <!-- A2 -->
  <g>
    <rect x="596" y="196" width="40" height="104" rx="8" fill="#16161a"/>
    <circle cx="616" cy="220" r="12" fill="#e5322d"/><circle cx="616" cy="248" r="12" fill="#f2b100"/><circle cx="616" cy="276" r="12" fill="#17a852"/>
    <rect x="570" y="152" width="92" height="34" rx="8" fill="#1f5eff"/>
    <text x="616" y="176" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">A2</text>
  </g>
  <!-- B -->
  <g>
    <rect x="504" y="604" width="40" height="104" rx="8" fill="#16161a"/>
    <circle cx="524" cy="628" r="12" fill="#e5322d"/><circle cx="524" cy="656" r="12" fill="#f2b100"/><circle cx="524" cy="684" r="12" fill="#17a852"/>
    <rect x="556" y="638" width="64" height="34" rx="8" fill="#d9480f"/>
    <text x="588" y="662" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">B</text>
  </g>

  <!-- jalakäijate foorid -->
  <g>
    <rect x="504" y="214" width="30" height="58" rx="6" fill="#16161a"/>
    <rect x="509" y="219" width="20" height="22" rx="3" fill="#e5322d"/><rect x="509" y="245" width="20" height="22" rx="3" fill="#3a3a3e"/>
    <rect x="496" y="180" width="48" height="28" rx="6" fill="#7c3aed"/>
    <text x="520" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">J1</text>
  </g>
  <g>
    <rect x="252" y="236" width="30" height="58" rx="6" fill="#16161a"/>
    <rect x="257" y="241" width="20" height="22" rx="3" fill="#e5322d"/><rect x="257" y="267" width="20" height="22" rx="3" fill="#3a3a3e"/>
    <rect x="198" y="248" width="48" height="28" rx="6" fill="#7c3aed"/>
    <text x="222" y="268" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">J2</text>
  </g>
  <g>
    <rect x="282" y="526" width="30" height="58" rx="6" fill="#16161a"/>
    <rect x="287" y="531" width="20" height="22" rx="3" fill="#e5322d"/><rect x="287" y="557" width="20" height="22" rx="3" fill="#3a3a3e"/>
    <rect x="274" y="592" width="48" height="28" rx="6" fill="#7c3aed"/>
    <text x="298" y="612" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">J3</text>
  </g>

  <!-- LEGEND -->
  <text x="830" y="62" font-size="26" font-weight="800" fill="#1c1c1e">Gonsiori × Vesivärava</text>
  <text x="830" y="90" font-size="16" fill="#66666c">Torupilli Selveri juures · skeem on lihtsustatud</text>

  <text x="830" y="140" font-size="15" font-weight="700" fill="#66666c" letter-spacing="1">AUTODE FOORID (FÜÜSILISED, ARDUINO)</text>
  <rect x="830" y="156" width="56" height="30" rx="7" fill="#1f5eff"/><text x="858" y="178" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">A1</text>
  <text x="900" y="170" font-size="17" font-weight="700" fill="#1c1c1e">Gonsiori, läänest</text>
  <text x="900" y="190" font-size="15" fill="#444">pin 9 punane · 8 kollane · 7 roheline</text>
  <rect x="830" y="208" width="56" height="30" rx="7" fill="#1f5eff"/><text x="858" y="230" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">A2</text>
  <text x="900" y="222" font-size="17" font-weight="700" fill="#1c1c1e">Gonsiori, idast</text>
  <text x="900" y="242" font-size="15" fill="#444">pin 2 punane · 3 kollane · 4 roheline</text>
  <rect x="830" y="260" width="56" height="30" rx="7" fill="#d9480f"/><text x="858" y="282" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">B</text>
  <text x="900" y="274" font-size="17" font-weight="700" fill="#1c1c1e">Vesivärava, lõunast</text>
  <text x="900" y="294" font-size="15" fill="#444">pin 10 punane · 11 kollane · 12 roheline</text>
  <text x="830" y="326" font-size="15" fill="#444">A1 ja A2 = grupp A, alati sama tuli.</text>
  <text x="830" y="346" font-size="15" fill="#444">Kõik LED-id: 220 Ω takisti, lühike jalg → GND.</text>

  <text x="830" y="400" font-size="15" font-weight="700" fill="#66666c" letter-spacing="1">JALAKÄIJAD (VEEBIS)</text>
  <rect x="830" y="416" width="48" height="28" rx="6" fill="#7c3aed"/><text x="854" y="436" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">J1</text>
  <text x="892" y="436" font-size="16" fill="#1c1c1e">üle Vesivärava (põhjas) · koos A-ga</text>
  <rect x="830" y="456" width="48" height="28" rx="6" fill="#7c3aed"/><text x="854" y="476" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">J2</text>
  <text x="892" y="476" font-size="16" fill="#1c1c1e">üle Gonsiori (läänes) · koos B-ga</text>
  <rect x="830" y="496" width="48" height="28" rx="6" fill="#7c3aed"/><text x="854" y="516" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">J3</text>
  <text x="892" y="516" font-size="16" fill="#1c1c1e">üle Vesivärava (lõunas) · koos A-ga</text>
  <text x="830" y="550" font-size="15" fill="#444">Jalakäija läheb roheliseks koos selle</text>
  <text x="830" y="570" font-size="15" fill="#444">autogrupiga, mille teed ta EI ületa.</text>

  <text x="830" y="624" font-size="15" font-weight="700" fill="#66666c" letter-spacing="1">FAASID</text>
  <text x="830" y="650" font-size="16" fill="#1c1c1e">1. A roheline · B punane · J1, J3 roheline</text>
  <text x="830" y="674" font-size="16" fill="#1c1c1e">2. A kollane → kõik punased</text>
  <text x="830" y="698" font-size="16" fill="#1c1c1e">3. B punane+kollane</text>
  <text x="830" y="722" font-size="16" fill="#1c1c1e">4. B roheline · A punane · J2 roheline</text>
  <text x="830" y="746" font-size="16" fill="#1c1c1e">5. B kollane → kõik punased</text>
  <text x="830" y="770" font-size="16" fill="#1c1c1e">6. A punane+kollane → tagasi 1</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
